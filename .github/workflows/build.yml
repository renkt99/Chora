name: dev build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.CHORA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/chora.p12"
            echo "CHORA_KEYSTORE_FILE=$RUNNER_TEMP/chora.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          CHORA_KEYSTORE_PASSWORD: ${{ secrets.CHORA_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error